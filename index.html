<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BingoBango Test Site</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    .hero-content {
      max-width: 800px;
    }

    h1 {
      font-size: 56px;
      margin-bottom: 20px;
    }

    p {
      font-size: 22px;
      line-height: 1.5;
      color: #555;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 24px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <section class="hero">
    <div class="hero-content">
      <h1>My First Proper Website</h1>
      <p>
        This website is hosted completely free using GitHub Pages.
      </p>
      <a class="button" href="#">Get in touch</a>
    </div>
  </section>

</body>
</html>
